<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DS-API · 气泡 1+3 混合</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #07080c; }
  body {
    width: 440px; margin: 0 auto; padding: 16px 16px 10px;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    color: #fff; zoom: 0.9;
  }
  .page-head { margin-bottom: 10px; }
  .page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .page-head h1 em {
    font-style: normal; background: linear-gradient(120deg, #b9ccff, #d8b9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .page-head p { color: #8a91a5; font-size: 11px; margin-top: 3px; }

  .canvas {
    width: 400px; margin: 0 auto 12px; border-radius: 18px; padding: 14px;
    background: linear-gradient(180deg, #f7f9ff 0%, #fff 32%, #fff 100%);
    display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    color: #14171f;
  }
  .row { display: flex; justify-content: flex-end; }
  .bubble-user {
    max-width: 55%; padding: 7px 12px; border-radius: 16px;
    background: linear-gradient(125deg, #ffffff 0%, #f0f3ff 54%, #f7f0ff 100%);
    border: 1px solid #e9edf7; font-size: 12.5px; color: #2e3340;
    box-shadow: 0 8px 20px -18px rgba(41, 68, 210, .5);
  }
  .assistant {
    max-width: 90%; padding: 9px 14px; border-radius: 17px;
    background: linear-gradient(125deg, #ffffff 0%, #f6f7ff 50%, #faf5ff 100%);
    border: 1px solid #f0eef9;
    box-shadow: 0 8px 20px -18px rgba(80, 60, 180, .35);
    font-size: 12.5px; line-height: 1.5; color: #10131a;
  }
  .assistant p { margin: 0 0 4px; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant pre {
    margin: 0; background: rgba(255, 255, 255, .72); border: 1px solid rgba(230, 235, 245, .9);
    border-radius: 7px; padding: 4px 8px; font-family: Consolas, monospace;
    font-size: 9.5px; line-height: 1.5; color: #2a2f3d; white-space: pre;
  }

  .note { color: #8a91a5; font-size: 11px; line-height: 1.9; width: 400px; margin: 0 auto; }
  .note b { color: #aeb8ff; }
</style>
</head>
<body>

<header class="page-head">
  <h1>DS-API · 气泡 <em>1 + 3 混合</em></h1>
  <p>白 → 浅蓝紫 → 浅紫：取 01 的紫端、03 的蓝中间。</p>
</header>

<div class="canvas">
  <div class="row"><span class="bubble-user">你好</span></div>
  <div class="assistant"><p>你好，有什么可以帮你的？</p></div>
  <div class="row"><span class="bubble-user">展开讲讲协程的挂起点。</span></div>
  <div class="assistant">
    <p>协程执行到 <code>suspend</code> 时保存状态并让出线程，结果回来再从原处恢复。</p>
    <pre>suspend fun load(): User {
    return api.fetchUser()
}</pre>
  </div>
</div>

<div class="note">
  <b>渐变：</b>#FFFFFF → #F6F7FF（蓝中间） → #FAF5FF（紫端，再调浅）<br />
  <b>边框：</b>#F0EEF9 · <b>圆角：</b>17px · 和用户气泡同一套白端渐变 + 细边框 + 阴影
</div>

</body>
</html>
