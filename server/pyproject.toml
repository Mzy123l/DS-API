[project]
name = "ds-api-relay"
version = "1.3.0"
description = "DS-API 中转服务：生成在服务器侧执行，客户端断线可恢复"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88

[tool.coverage.run]
source = ["app"]
branch = true
