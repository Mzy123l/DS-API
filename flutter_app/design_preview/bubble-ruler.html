<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DS-API · 气泡色阶尺</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #07080c; }
  body {
    width: 900px; margin: 0 auto; padding: 18px 16px;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    color: #fff; zoom: 0.9;
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #a9b8ff; }
  p.sub { color: #8a91a5; font-size: 11.5px; margin-top: 4px; }

  .strip { display: flex; gap: 8px; margin-top: 18px; }
  .swatch { width: 96px; }
  .chip { height: 64px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); }
  .no { color: #d6dae7; font-size: 11px; margin-top: 6px; font-weight: 600; }
  .hex { color: #7f88a8; font-size: 9.5px; font-family: Consolas, monospace; margin-top: 1px; }

  .note { margin-top: 22px; color: #8a91a5; font-size: 12px; line-height: 1.9; }
  .note b { color: #aeb8ff; }
</style>
</head>
<body>

<h1>DS-API · 气泡 <em>色阶尺</em></h1>
<p class="sub">8 档连续浅度，色相都是蓝紫。告诉我编号，或者「3 和 4 之间」。</p>

<div class="strip">
  <div class="swatch"><div class="chip" style="background:#d8deff"></div><div class="no">1</div><div class="hex">#D8DEFF</div></div>
  <div class="swatch"><div class="chip" style="background:#dde3ff"></div><div class="no">2</div><div class="hex">#DDE3FF</div></div>
  <div class="swatch"><div class="chip" style="background:#e2e7ff"></div><div class="no">3</div><div class="hex">#E2E7FF</div></div>
  <div class="swatch"><div class="chip" style="background:#e7ebff"></div><div class="no">4</div><div class="hex">#E7EBFF</div></div>
  <div class="swatch"><div class="chip" style="background:#ecefff"></div><div class="no">5</div><div class="hex">#ECEFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#f0f2ff"></div><div class="no">6</div><div class="hex">#F0F2FF</div></div>
  <div class="swatch"><div class="chip" style="background:#f4f6ff"></div><div class="no">7</div><div class="hex">#F4F6FF</div></div>
  <div class="swatch"><div class="chip" style="background:#f8f9ff"></div><div class="no">8</div><div class="hex">#F8F9FF</div></div>
</div><div class="note">
  这 8 个是「明度」的连续变化。选一个作为气泡的<b>浅端</b>，深端我会自动加深 8% 做渐变（保持蓝紫、不加白）。
</div>

</body>
</html>
